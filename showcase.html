<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 小方 · 液态玻璃 · 背景切换</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #fff; background: #0b1220;
  }

  /* 背景舞台：三张图叠在一起，靠按钮切 */
  .stage { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0; transform: scale(1.04);
    transition: opacity 0.7s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .bg.is-on { opacity: 1; transform: scale(1); }
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.45) 34%, rgba(0,0,0,0.08) 62%, rgba(0,0,0,0) 78%),
      linear-gradient(0deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0) 45%);
  }

  /* 顶部切换按钮 */
  .topbar {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    z-index: 80; display: flex; gap: 12px;
  }
  .navbtn {
    border: 0; cursor: pointer; color: rgba(255,255,255,0.86);
    padding: 12px 26px; border-radius: 999px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
    user-select: none; touch-action: none; transform-origin: 50% 50%;
    background: rgba(255,255,255,0.14); overflow: hidden;
    box-shadow: 0 4px 8px rgba(0,0,0,0.22), 0 -8px 20px inset rgba(0,0,0,0.14);
    transition: color 0.3s ease, background 0.3s ease;
  }
  .navbtn.is-active { color: #fff; background: rgba(255,255,255,0.34); }

  /* 左下文字块 */
  .panel {
    position: fixed; left: 6vw; bottom: 12vh; z-index: 20;
    max-width: 560px; transition: opacity 0.28s ease, transform 0.28s ease;
  }
  .panel.is-out { opacity: 0; transform: translateY(8px); }
  .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.66); }
  .panel h1 { margin-top: 12px; font-size: clamp(30px, 4.4vw, 52px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .panel .desc { margin-top: 16px; font-size: 14.5px; line-height: 1.85; color: rgba(255,255,255,0.82); }
  .chips { display: flex; gap: 10px; margin-top: 20px; }
  .chip { width: 38px; height: 38px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); }
  .micro { margin-top: 18px; font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.8; }

  /* 悬浮观察透镜 */
  .lens {
    position: fixed; width: 150px; height: 150px; border-radius: 50%;
    cursor: grab; touch-action: none; user-select: none; z-index: 50;
    will-change: transform, left, top;
    background: rgba(255,255,255,0.08); overflow: hidden;
    box-shadow: 0 4px 8px rgba(0,0,0,0.22), 0 -8px 20px inset rgba(0,0,0,0.14);
  }
  .lens:active { cursor: grabbing; }
  #lensA { left: calc(50vw + 150px); top: calc(38vh + 40px); }
  #lensB { left: calc(50vw + 90px); top: calc(18vh); width: 260px; height: 96px; border-radius: 999px; }
  #lensC { left: calc(50vw - 75px);  top: calc(38vh - 130px); width: 110px; height: 110px; }

  /* 发光层 */
  .lit-glow {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at var(--lx,50%) var(--ly,50%),
      rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.25) 40%, transparent 70%);
    opacity: 0; transition: opacity 0.25s; mix-blend-mode: soft-light;
  }

  /* 右侧抽屉（默认收起，深色文字） */
  #drawer {
    position: fixed; right: 0; top: 0; height: 100vh; width: 264px; z-index: 100;
    border-radius: 22px 0 0 22px; padding: 56px 20px 20px; color: #1d1d1f;
    transform: translateX(0); transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.64, 1);
    background: rgba(255,255,255,0.78);
    -webkit-backdrop-filter: blur(24px) saturate(1.25);
    backdrop-filter: blur(24px) saturate(1.25);
    border: 1px solid rgba(0,0,0,0.08); border-right: 0;
    box-shadow: -10px 0 34px rgba(0,0,0,0.1);
  }
  #drawer.closed { transform: translateX(calc(100% - 52px)); }
  #drawer h2 { font-size: 15px; font-weight: 700; margin-bottom: 2px; color: #1d1d1f; }
  #drawer .sub { font-size: 11px; color: #86868b; margin-bottom: 14px; }
  .ctrl { margin-bottom: 15px; }
  .ctrl label { display: flex; justify-content: space-between; font-size: 12px; color: #48484c; margin-bottom: 5px; }
  .ctrl label b { font-variant-numeric: tabular-nums; font-weight: 600; color: #1d1d1f; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 5px; border-radius: 3px;
    background: rgba(0,0,0,0.18); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px;
    border-radius: 50%; background: #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(0,0,0,0.1); cursor: grab; }
  #drawerHandle { position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 64px; border-radius: 14px; border: 0; cursor: pointer;
    color: #1d1d1f; font-size: 15px; background: rgba(0,0,0,0.08); }
  #resetBtn { width: 100%; border: 0; border-radius: 12px; padding: 8px 0; cursor: pointer;
    color: #1d1d1f; font-size: 12.5px; font-weight: 600; background: rgba(0,0,0,0.08); }
</style>
</head>
<body>
  <!-- 背景：三张图叠放，按钮切换 -->
  <div class="stage">
    <div class="bg is-on" style="background-image:url(bg-1.jpg)"></div>
    <div class="bg" style="background-image:url(bg-2.jpg)"></div>
    <div class="bg" style="background-image:url(bg-3.jpg)"></div>
    <div class="scrim"></div>
  </div>

  <nav class="topbar">
    <button class="navbtn is-active" data-idx="0">🏔️ 雪山云海</button>
    <button class="navbtn" data-idx="1">🍂 金秋森林</button>
    <button class="navbtn" data-idx="2">🌫️ 晨雾山林</button>
  </nav>

  <main class="panel" id="panel">
    <div class="eyebrow" id="eyebrow">No.1 · Cold &amp; Crisp</div>
    <h1 id="title">雪山云海 · 冷冽蓝白</h1>
    <p class="desc" id="desc">高对比的冷色天空与深色山脊是最容易观察折射的背景：亮暗交界的山脊线穿过玻璃边缘时，会被折出一道清晰的弯曲错位，色散镶边在雪白区域也清晰可辨。</p>
    <div class="chips" id="chips"></div>
    <p class="micro" id="micro">ABC 123 光学扭曲 · 拖一块玻璃压过这行小字，注意山脊线在玻璃边缘的弯折方向与色散彩边。</p>
  </main>

  <!-- 悬浮观察玻璃 -->
  <div class="lens" id="lensA"><div class="lit-glow"></div></div>
  <div class="lens" id="lensB"><div class="lit-glow"></div></div>
  <div class="lens" id="lensC"><div class="lit-glow"></div></div>

  <!-- 右侧抽屉 -->
  <div id="drawer" class="closed">
    <button id="drawerHandle">⟨</button>
    <h2>折射参数</h2>
    <div class="sub">实时作用于页面全部玻璃</div>
    <div class="ctrl"><label>折射率 <b id="v-ref">1.0×</b></label>
      <input type="range" id="s-ref" min="0.2" max="2.5" step="0.05" value="1"></div>
    <div class="ctrl"><label>折射圈厚度 <b id="v-edge">1.0×</b></label>
      <input type="range" id="s-edge" min="0.4" max="3" step="0.05" value="1"></div>
    <div class="ctrl"><label>形状圆角 <b id="v-rad">0.6</b></label>
      <input type="range" id="s-rad" min="0" max="1" step="0.02" value="0.6"></div>
    <div class="ctrl"><label>玻璃白度 <b id="v-tint">0.08</b></label>
      <input type="range" id="s-tint" min="0" max="0.5" step="0.01" value="0.08"></div>
    <div class="ctrl"><label>背景模糊 <b id="v-blur">0.25px</b></label>
      <input type="range" id="s-blur" min="0" max="6" step="0.25" value="0.25"></div>
    <button id="resetBtn">恢复默认</button>
  </div>

  <script>
    'use strict';
    var SVGNS = 'http://www.w3.org/2000/svg';
    var XLINK = 'http://www.w3.org/1999/xlink';
    var _uid = 0;
    var PARAMS = { ref: 1, edge: 1, rad: 0.6, tint: 0.08, blur: 0.25 };
    var DEFAULTS = JSON.parse(JSON.stringify(PARAMS));
    var smoothStep = function (a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); };
    var roundedRectSDF = function (x, y, w, h, r) {
      var qx = Math.abs(x) - w + r, qy = Math.abs(y) - h + r;
      return Math.min(Math.max(qx, qy), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) - r;
    };

    /* 原版引擎 + 可调参数 */
    function makeGlass(el) {
      var strength = 1, W = el.offsetWidth, H = el.offsetHeight;
      var fid = 'lg-' + (++_uid);
      var svg = document.createElementNS(SVGNS, 'svg');
      svg.setAttribute('width', '0'); svg.setAttribute('height', '0');
      svg.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;';
      var filter = document.createElementNS(SVGNS, 'filter');
      filter.setAttribute('id', fid + '_filter');
      filter.setAttribute('filterUnits', 'userSpaceOnUse');
      filter.setAttribute('x', '0'); filter.setAttribute('y', '0');
      filter.setAttribute('colorInterpolationFilters', 'sRGB');
      var feImage = document.createElementNS(SVGNS, 'feImage');
      feImage.setAttribute('preserveAspectRatio', 'none');
      var feDisp = document.createElementNS(SVGNS, 'feDisplacementMap');
      feDisp.setAttribute('in', 'SourceGraphic'); feDisp.setAttribute('in2', fid + '_map');
      feDisp.setAttribute('xChannelSelector', 'R'); feDisp.setAttribute('yChannelSelector', 'G');
      filter.appendChild(feImage); filter.appendChild(feDisp);
      svg.appendChild(filter); document.body.appendChild(svg);
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');

      function update() {
        W = Math.max(2, el.offsetWidth); H = Math.max(2, el.offsetHeight);
        canvas.width = W; canvas.height = H;
        filter.setAttribute('width', W); filter.setAttribute('height', H);
        feImage.setAttribute('width', W); feImage.setAttribute('height', H);
        var data = new Uint8ClampedArray(W * H * 4);
        var raw = [], maxScale = 0, i, x, y, d, px, py, dx, dy;
        for (i = 0; i < data.length; i += 4) {
          x = (i / 4) % W; y = Math.floor(i / 4 / W);
          var ix = x / W - 0.5, iy = y / H - 0.5;
          d = roundedRectSDF(ix, iy, 0.3, 0.2, PARAMS.rad);
          var disp = smoothStep(0.8, 0, d - 0.15 / PARAMS.edge / strength);
          var s = smoothStep(0, 1, disp);
          px = (ix * s + 0.5) * W; py = (iy * s + 0.5) * H;
          dx = px - x; dy = py - y;
          maxScale = Math.max(maxScale, Math.abs(dx), Math.abs(dy));
          raw.push(dx, dy);
        }
        maxScale *= 0.5;
        var idx = 0;
        for (i = 0; i < data.length; i += 4) {
          data[i] = (raw[idx++] / maxScale + 0.5) * 255;
          data[i + 1] = (raw[idx++] / maxScale + 0.5) * 255;
          data[i + 2] = 0; data[i + 3] = 255;
        }
        ctx.putImageData(new ImageData(data, W, H), 0, 0);
        feImage.setAttributeNS(XLINK, 'href', canvas.toDataURL());
        feDisp.setAttribute('scale', String(maxScale * PARAMS.ref));
        el.style.backdropFilter = 'url(#' + fid + '_filter) blur(' + PARAMS.blur + 'px) contrast(1.2) brightness(1.05) saturate(1.1)';
        el.style.webkitBackdropFilter = el.style.backdropFilter;
        el.style.background = 'rgba(255,255,255,' + PARAMS.tint + ')';
      }
      update();
      new ResizeObserver(update).observe(el);
      return { update: update, setStrength: function (s) { strength = s; update(); } };
    }

    /* 光照系统 */
    var allGlass = [];
    function setLit(el, cx, cy, it) {
      var g = el._glow; if (!g) return;
      if (it <= 0.02) { g.style.opacity = '0'; return; }
      var r = el.getBoundingClientRect();
      g.style.setProperty('--lx', ((cx - r.left) / r.width * 100) + '%');
      g.style.setProperty('--ly', ((cy - r.top) / r.height * 100) + '%');
      g.style.opacity = it.toFixed(2);
    }
    function illuminate(src, cx, cy, radius, base) {
      allGlass.forEach(function (o) {
        if (o.el === src) return;
        var r = o.el.getBoundingClientRect();
        setLit(o.el, cx, cy, base * Math.max(0, 1 - Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy) / radius));
      });
    }

    /* 果冻 */
    function applyJelly(el, k, deg, tx, ty) {
      tx = tx || 0; ty = ty || 0;
      var t = 'translate3d(' + tx + 'px,' + ty + 'px,0)';
      if (k && k >= 0.001) t += ' rotate(' + deg + 'deg) scale(' + (1 + k) + ',' + (1 - k * 0.45) + ') rotate(' + (-deg) + 'deg)';
      el.style.transform = t;
    }
    function springEase(t) { return 1 - Math.exp(-5 * t) * Math.cos(9 * t); }
    function jellyBack(el, from, dur, onDone, tx, ty) {
      var t0 = performance.now();
      (function step(now) {
        var t = Math.min(1, (now - t0) / dur);
        applyJelly(el, from * (1 - springEase(t)), 0, tx, ty);
        if (t < 1) requestAnimationFrame(step);
        else { el.style.transform = ''; if (onDone) onDone(); }
      })(t0);
    }

    /* 按钮按压光效 */
    var REST_SHADOW = '0 4px 8px rgba(0,0,0,0.22), 0 -8px 20px inset rgba(0,0,0,0.14)';
    var PRESS_SHADOW = REST_SHADOW +
      ', 0 0 22px 5px rgba(255,255,255,0.9), 0 0 60px 14px rgba(255,255,255,0.45)' +
      ', inset 0 0 16px 3px rgba(255,255,255,0.55), inset 0 -8px 16px rgba(0,0,0,0.18)';
    function volumeLight(cx, cy, r) {
      var v = document.createElement('div');
      v.style.cssText = 'position:fixed;pointer-events:none;z-index:70;border-radius:50%;' +
        'left:' + (cx - r) + 'px;top:' + (cy - r) + 'px;width:' + r * 2 + 'px;height:' + r * 2 + 'px;' +
        'background:radial-gradient(circle,rgba(255,255,255,0.75) 0%,rgba(255,255,255,0.2) 38%,transparent 65%);' +
        'mix-blend-mode:screen;opacity:1;transition:opacity 0.9s ease-out,transform 1.4s cubic-bezier(0.16,1,0.3,1);transform:scale(0.4);';
      document.body.appendChild(v);
      requestAnimationFrame(function () {
        v.style.transform = 'scale(1.25)'; v.style.opacity = '0';
        setTimeout(function () { v.remove(); }, 1500);
      });
    }

    /* 三套背景对应的文案 */
    var SCENES = [
      {
        eyebrow: 'No.1 · Cold & Crisp',
        title: '雪山云海 · 冷冽蓝白',
        desc: '高对比的冷色天空与深色山脊是最容易观察折射的背景：亮暗交界的山脊线穿过玻璃边缘时，会被折出一道清晰的弯曲错位，色散镶边在雪白区域也清晰可辨。',
        chips: ['#9db8d9', '#3f5878', '#e8f0f8', '#5a7ba6'],
        micro: 'ABC 123 光学扭曲 · 拖一块玻璃压过这行小字，注意山脊线在玻璃边缘的弯折方向与色散彩边。'
      },
      {
        eyebrow: 'No.2 · Warm & Golden',
        title: '金秋森林 · 暖橙丁达尔',
        desc: '最接近 Apple 官方演示场景的暖色素材。斜射的丁达尔光束穿过玻璃时，光会在折射圈里被重新分配，暖橙高光区域放大感最强，树干在边缘处出现最明显的位移。',
        chips: ['#d98e3f', '#7a4a1f', '#f2d9a8', '#b87333'],
        micro: 'Liquid Glass · 用宽胶囊透镜横扫树干，观察垂直线条的折射错位与边缘厚度。'
      },
      {
        eyebrow: 'No.3 · Misty & Ethereal',
        title: '晨雾山林 · 青绿空灵',
        desc: '高雾度低对比背景是折射的压力测试：细节稀少时，只有把折射率拉高、折射圈加厚，玻璃的存在感才会回来。适合用右侧抽屉反复对比参数效果。',
        chips: ['#8fae9c', '#4a6657', '#dce8e0', '#6b8f7d'],
        micro: 'Refraction Test · 在雾中把折射率滑杆拉到 2.5×，玻璃会重新显形。'
      }
    ];

    var bgs = Array.prototype.slice.call(document.querySelectorAll('.bg'));
    var navBtns = Array.prototype.slice.call(document.querySelectorAll('.navbtn'));
    var panel = document.getElementById('panel');
    var eyebrowEl = document.getElementById('eyebrow');
    var titleEl = document.getElementById('title');
    var descEl = document.getElementById('desc');
    var chipsEl = document.getElementById('chips');
    var microEl = document.getElementById('micro');
    var current = 0;
    var switching = false;

    function paintChips(colors) {
      chipsEl.innerHTML = '';
      colors.forEach(function (c) {
        var d = document.createElement('div');
        d.className = 'chip';
        d.style.background = c;
        chipsEl.appendChild(d);
      });
    }
    function applyScene(idx) {
      var s = SCENES[idx];
      eyebrowEl.textContent = s.eyebrow;
      titleEl.textContent = s.title;
      descEl.textContent = s.desc;
      microEl.textContent = s.micro;
      paintChips(s.chips);
    }

    function switchTo(idx) {
      if (idx === current || switching) return;
      switching = true;
      bgs.forEach(function (b, i) { b.classList.toggle('is-on', i === idx); });
      navBtns.forEach(function (b, i) { b.classList.toggle('is-active', i === idx); });
      panel.classList.add('is-out');
      setTimeout(function () {
        applyScene(idx);
        panel.classList.remove('is-out');
        switching = false;
      }, 280);
      current = idx;
    }

    applyScene(0);

    /* 按钮：只负责切换背景 */
    navBtns.forEach(function (b) {
      makeGlass(b);
      allGlass.push({ el: b, g: null });
      b.addEventListener('click', function () { switchTo(parseInt(b.dataset.idx, 10)); });
      b.addEventListener('pointerdown', function (e) {
        b.style.boxShadow = PRESS_SHADOW;
        applyJelly(b, 0.1, 0);
        var r = b.getBoundingClientRect();
        volumeLight(r.left + r.width / 2, r.top + r.height / 2, r.width * 1.3);
        illuminate(b, e.clientX, e.clientY, 600, 1);
      });
      window.addEventListener('pointerup', function () {
        b.style.boxShadow = REST_SHADOW;
        jellyBack(b, 0.1, 500);
        allGlass.forEach(function (o) { if (o.el !== b) setLit(o.el, 0, 0, 0); });
      });
    });

    /* 玻璃元素注册（透镜带发光层） */
    var lensA = document.getElementById('lensA');
    var lensB = document.getElementById('lensB');
    var lensC = document.getElementById('lensC');
    var lensInstances = [];
    function reg(el) {
      var g = makeGlass(el);
      el._glow = el.querySelector('.lit-glow');
      allGlass.push({ el: el, g: g });
      lensInstances.push(g);
      return g;
    }
    var gA = reg(lensA), gB = reg(lensB), gC = reg(lensC);

    /* 透镜拖拽 */
    function makeFluidDraggable(el, inst) {
      var st = { on: false, sx: 0, sy: 0, bx: 0, by: 0, tx: 0, ty: 0, lx: 0, ly: 0, lt: 0, vx: 0, vy: 0, raf: null };
      el.addEventListener('pointerdown', function (e) {
        st.on = true;
        if (st.raf) cancelAnimationFrame(st.raf);
        st.sx = e.clientX; st.sy = e.clientY;
        st.bx = el.offsetLeft; st.by = el.offsetTop;
        st.tx = 0; st.ty = 0; el._tx = 0; el._ty = 0;
        st.lx = e.clientX; st.ly = e.clientY; st.lt = performance.now();
        st.vx = st.vy = 0;
        try { el.setPointerCapture(e.pointerId); } catch (_e) {}
        inst.setStrength(1.2);
        e.preventDefault();
      });
      window.addEventListener('pointermove', function (e) {
        if (!st.on) return;
        st.tx = e.clientX - st.sx; st.ty = e.clientY - st.sy;
        el._tx = st.tx; el._ty = st.ty;
        var now = performance.now(), dt = Math.max(1, now - st.lt);
        st.vx = st.vx * 0.7 + (e.clientX - st.lx) / dt * 16 * 0.3;
        st.vy = st.vy * 0.7 + (e.clientY - st.ly) / dt * 16 * 0.3;
        st.lx = e.clientX; st.ly = e.clientY; st.lt = now;
        frame(el, st.vx, st.vy, e.clientX, e.clientY);
      });
      function frame(el2, vx_, vy_, px, py) {
        var speed = Math.hypot(vx_, vy_);
        var k = Math.min(0.16, speed / 420);
        var deg = speed > 0.5 ? Math.atan2(vy_, vx_) * 180 / Math.PI : 0;
        applyJelly(el2, k, deg, el2._tx || 0, el2._ty || 0);
        var glow = Math.min(0.85, speed / 26);
        el2.style.boxShadow = REST_SHADOW +
          ', 0 0 ' + (18 + speed * 2.2) + 'px rgba(255,255,255,' + (0.12 + glow * 0.5).toFixed(2) + ')';
        illuminate(el2, px, py, 460, Math.max(0.25, glow));
      }
      function bake() {
        el.style.left = (st.bx + st.tx) + 'px';
        el.style.top = (st.by + st.ty) + 'px';
        el.style.transform = ''; el._tx = 0; el._ty = 0;
      }
      function end() {
        if (!st.on) return;
        st.on = false;
        inst.setStrength(1);
        allGlass.forEach(function (o) { if (o.el !== el) setLit(o.el, 0, 0, 0); });
        if (st.raf) cancelAnimationFrame(st.raf);
        (function glide() {
          st.vx *= 0.94; st.vy *= 0.94;
          st.tx += st.vx; st.ty += st.vy;
          el._tx = st.tx; el._ty = st.ty;
          var speed = Math.hypot(st.vx, st.vy);
          if (speed > 0.4) {
            frame(el, st.vx, st.vy, el.offsetLeft + el.offsetWidth / 2, el.offsetTop + el.offsetHeight / 2);
            st.raf = requestAnimationFrame(glide);
          } else {
            st.raf = null;
            el.style.boxShadow = REST_SHADOW;
            jellyBack(el, Math.min(0.1, speed / 40 + 0.04), 500, bake, st.tx, st.ty);
          }
        })();
      }
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);
    }
    makeFluidDraggable(lensA, gA);
    makeFluidDraggable(lensB, gB);
    makeFluidDraggable(lensC, gC);

    /* 抽屉 */
    var drawer = document.getElementById('drawer');
    document.getElementById('drawerHandle').addEventListener('click', function () {
      drawer.classList.toggle('closed');
      this.textContent = drawer.classList.contains('closed') ? '⟨' : '⟩';
    });
    function bind(id, key, fmt) {
      var s = document.getElementById('s-' + id), v = document.getElementById('v-' + id);
      s.addEventListener('input', function () {
        PARAMS[key] = parseFloat(s.value);
        v.textContent = fmt(PARAMS[key]);
        lensInstances.forEach(function (g) { g.update(); });
      });
      return s;
    }
    var sliders = [
      bind('ref', 'ref', function (x) { return x.toFixed(2) + '×'; }),
      bind('edge', 'edge', function (x) { return x.toFixed(2) + '×'; }),
      bind('rad', 'rad', function (x) { return x.toFixed(2); }),
      bind('tint', 'tint', function (x) { return x.toFixed(2); }),
      bind('blur', 'blur', function (x) { return x + 'px'; })
    ];
    document.getElementById('resetBtn').addEventListener('click', function () {
      Object.keys(DEFAULTS).forEach(function (k) { PARAMS[k] = DEFAULTS[k]; });
      sliders[0].value = PARAMS.ref; sliders[1].value = PARAMS.edge; sliders[2].value = PARAMS.rad;
      sliders[3].value = PARAMS.tint; sliders[4].value = PARAMS.blur;
      document.getElementById('v-ref').textContent = '1.00×';
      document.getElementById('v-edge').textContent = '1.00×';
      document.getElementById('v-rad').textContent = '0.60';
      document.getElementById('v-tint').textContent = '0.08';
      document.getElementById('v-blur').textContent = '0.25px';
      lensInstances.forEach(function (g) { g.update(); });
    });
  </script>
</body>
