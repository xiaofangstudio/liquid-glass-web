<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>液态玻璃 · 三件套（原版引擎）🍎</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #1c1c1e;
    background:
      radial-gradient(ellipse at 18% 22%, rgba(94, 200, 255, 0.95) 0%, transparent 45%),
      radial-gradient(ellipse at 82% 15%, rgba(255, 214, 112, 0.95) 0%, transparent 42%),
      radial-gradient(ellipse at 12% 85%, rgba(255, 133, 182, 0.9) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 80%, rgba(133, 242, 178, 0.9) 0%, transparent 42%),
      linear-gradient(135deg, #e8f4ff, #fdeef7 45%, #eaffe9);
    background-attachment: fixed;
    overflow: hidden;
  }
  .grid {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .samples { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .samples p { position: absolute; color: rgba(28,28,30,0.62); white-space: nowrap; }
  .s1 { left: 6%;  top: 16%; font-size: 42px; font-weight: 700; }
  .s2 { left: 55%; top: 32%; font-size: 26px; font-weight: 500; }
  .s3 { left: 10%; top: 60%; font-size: 30px; font-weight: 600; }
  .s4 { left: 58%; top: 74%; font-size: 52px; font-weight: 800; }
  .s5 { left: 30%; top: 47%; font-size: 20px; font-weight: 400; }

  .stage {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 46px;
  }

  /* 原版同款光影：外阴影 + 底部内阴影 */
  .glass-look {
    background: rgba(255,255,255,0.08);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25), 0 -10px 25px inset rgba(0, 0, 0, 0.15);
    overflow: hidden;
  }
  #showcase {
    width: 260px; height: 170px; border-radius: 40px;
    cursor: grab; touch-action: none; user-select: none;
  }
  #showcase .cap {
    display: grid; place-items: center; height: 100%;
    font-size: 13px; color: rgba(28,28,30,0.55); pointer-events: none;
  }
  #capsule {
    border: 0; cursor: pointer; color: #1c1c1e;
    width: 340px; height: 96px; border-radius: 999px;
    font-size: 22px; font-weight: 640; letter-spacing: 0.02em;
    display: grid; place-items: center; user-select: none; touch-action: none;
    transform-origin: 50% 50%;
  }
  #lens {
    position: fixed; width: 160px; height: 160px; border-radius: 50%;
    left: calc(50vw + 230px); top: calc(50vh + 60px); z-index: 50;
    cursor: grab; touch-action: none; user-select: none;
  }
  #lens:active, #showcase:active { cursor: grabbing; }
  #lens .hint {
    display: grid; place-items: center; height: 100%;
    font-size: 12.5px; font-weight: 550; color: rgba(28,28,30,0.55); pointer-events: none;
  }
  .tip {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: rgba(28,28,30,0.5); pointer-events: none; z-index: 60;
  }

  .flash {
    position: fixed; z-index: 40; pointer-events: none;
    width: 900px; height: 900px; border-radius: 50%;
    margin: -450px 0 0 -450px;
    background: radial-gradient(circle,
      rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.35) 22%,
      rgba(255,255,255,0.12) 45%, transparent 68%);
    mix-blend-mode: soft-light;
    opacity: 0; transform: scale(0.25);
  }
  .flash.play { animation: flashOut 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes flashOut {
    0%   { opacity: 1; transform: scale(0.25); }
    60%  { opacity: 0.7; }
    100% { opacity: 0; transform: scale(1.15); }
  }
  .lit-glow {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at var(--lx, 50%) var(--ly, 50%),
      rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.25) 40%, transparent 70%);
    opacity: 0; transition: opacity 0.25s;
    mix-blend-mode: soft-light;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="samples">
    <p class="s1">液态玻璃 Liquid Glass</p>
    <p class="s2">拖动玻璃看文字弯曲</p>
    <p class="s3">边缘折射 Edge Refraction</p>
    <p class="s4">ABC 123 光学扭曲</p>
    <p class="s5">把玻璃挪到这行字上试试</p>
  </div>
  <div class="stage">
    <div id="showcase" class="glass-look"><span class="cap">静态扭曲 · 无动画 · 可拖</span></div>
    <button id="capsule" class="glass-look">继续</button>
  </div>
  <div id="lens" class="glass-look"><span class="hint">拖我 · 快甩发光 💡</span><div class="lit-glow" id="lensGlow"></div></div>
  <div class="flash" id="flash"></div>
  <p class="tip">三块玻璃折射完全相同（原版 fragment）· 互相照亮</p>

  <script>
    /* ============================================================
       原版 shuding/liquid-glass.js 逐字移植（github.com/shuding/liquid-glass）
       同一 fragment：roundedRectSDF(0.3, 0.2, 0.6) + smoothStep(0.8, 0, d-0.15)
       同一归一化：maxScale *= 0.5，feDisp scale = maxScale
       同一滤镜链：blur(0.25) contrast(1.2) brightness(1.05) saturate(1.1)
       差异仅在于：挂到已有元素上，而不是自建容器
       ============================================================ */
    'use strict';
    function smoothStep(a, b, t) {
      t = Math.max(0, Math.min(1, (t - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }
    function length(x, y) { return Math.sqrt(x * x + y * y); }
    function roundedRectSDF(x, y, width, height, radius) {
      const qx = Math.abs(x) - width + radius;
      const qy = Math.abs(y) - height + radius;
      return Math.min(Math.max(qx, qy), 0) + length(Math.max(qx, 0), Math.max(qy, 0)) - radius;
    }
    var SVGNS = 'http://www.w3.org/2000/svg';
    var XLINK = 'http://www.w3.org/1999/xlink';
    var _uid = 0;

    function makeGlass(el, opts) {
      opts = opts || {};
      var strength = 1;          // 按压挤压时临时增强
      var canvasDPI = 1;         // 原版同款
      var W = el.offsetWidth, H = el.offsetHeight;

      var fid = 'liquid-glass-' + (++_uid);
      var svg = document.createElementNS(SVGNS, 'svg');
      svg.setAttribute('xmlns', SVGNS);
      svg.setAttribute('width', '0'); svg.setAttribute('height', '0');
      svg.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;';
      var defs = document.createElementNS(SVGNS, 'defs');
      var filter = document.createElementNS(SVGNS, 'filter');
      filter.setAttribute('id', fid + '_filter');
      filter.setAttribute('filterUnits', 'userSpaceOnUse');
      filter.setAttribute('colorInterpolationFilters', 'sRGB');
      filter.setAttribute('x', '0'); filter.setAttribute('y', '0');
      filter.setAttribute('width', String(W)); filter.setAttribute('height', String(H));
      var feImage = document.createElementNS(SVGNS, 'feImage');
      feImage.setAttribute('id', fid + '_map');
      feImage.setAttribute('width', String(W)); feImage.setAttribute('height', String(H));
      var feDisp = document.createElementNS(SVGNS, 'feDisplacementMap');
      feDisp.setAttribute('in', 'SourceGraphic');
      feDisp.setAttribute('in2', fid + '_map');
      feDisp.setAttribute('xChannelSelector', 'R');
      feDisp.setAttribute('yChannelSelector', 'G');
      filter.appendChild(feImage); filter.appendChild(feDisp);
      defs.appendChild(filter); svg.appendChild(defs);
      document.body.appendChild(svg);

      var canvas = document.createElement('canvas');
      canvas.style.display = 'none';
      var ctx = canvas.getContext('2d');

      // 原版 fragment（逐字）：所有玻璃共用同一折射分布
      function fragment(uv) {
        var ix = uv.x - 0.5;
        var iy = uv.y - 0.5;
        var distanceToEdge = roundedRectSDF(ix, iy, 0.3, 0.2, 0.6);
        var displacement = smoothStep(0.8, 0, distanceToEdge - 0.15 / strength);
        var scaled = smoothStep(0, 1, displacement);
        return { x: ix * scaled + 0.5, y: iy * scaled + 0.5 };
      }

      function updateShader() {
        W = Math.max(2, el.offsetWidth);
        H = Math.max(2, el.offsetHeight);
        canvas.width = W * canvasDPI; canvas.height = H * canvasDPI;
        filter.setAttribute('width', String(W)); filter.setAttribute('height', String(H));
        feImage.setAttribute('width', String(W)); feImage.setAttribute('height', String(H));

        var w = W * canvasDPI, h = H * canvasDPI;
        var data = new Uint8ClampedArray(w * h * 4);
        var maxScale = 0;
        var rawValues = [];
        for (var i = 0; i < data.length; i += 4) {
          var x = (i / 4) % w;
          var y = Math.floor(i / 4 / w);
          var pos = fragment({ x: x / w, y: y / h });
          var dx = pos.x * w - x;
          var dy = pos.y * h - y;
          maxScale = Math.max(maxScale, Math.abs(dx), Math.abs(dy));
          rawValues.push(dx, dy);
        }
        maxScale *= 0.5;   // 原版同款折半
        var index = 0;
        for (i = 0; i < data.length; i += 4) {
          data[i] = (rawValues[index++] / maxScale + 0.5) * 255;
          data[i + 1] = (rawValues[index++] / maxScale + 0.5) * 255;
          data[i + 2] = 0;
          data[i + 3] = 255;
        }
        ctx.putImageData(new ImageData(data, w, h), 0, 0);
        feImage.setAttributeNS(XLINK, 'href', canvas.toDataURL());
        feDisp.setAttribute('scale', String(maxScale / canvasDPI));
        // 原版同款滤镜链
        el.style.backdropFilter = 'url(#' + fid + '_filter) blur(0.25px) contrast(1.2) brightness(1.05) saturate(1.1)';
        el.style.webkitBackdropFilter = el.style.backdropFilter;
      }

      updateShader();
      new ResizeObserver(updateShader).observe(el);

      return {
        setStrength: function (s) { strength = s; updateShader(); },
        destroy: function () { svg.remove(); }
      };
    }

    /* ================= 光照系统（互相照亮） ================= */
    var flash = document.getElementById('flash');
    function emitFlash(cx, cy) {
      flash.style.left = cx + 'px'; flash.style.top = cy + 'px';
      flash.classList.remove('play');
      void flash.offsetWidth;
      flash.classList.add('play');
    }
    function setLit(el, cx, cy, intensity) {
      var g = el._glow;
      if (!g) return;
      if (intensity <= 0.02) { g.style.opacity = '0'; return; }
      var r = el.getBoundingClientRect();
      g.style.setProperty('--lx', ((cx - r.left) / r.width * 100) + '%');
      g.style.setProperty('--ly', ((cy - r.top) / r.height * 100) + '%');
      g.style.opacity = intensity.toFixed(2);
    }
    function illuminate(srcEl, cx, cy, radius, base) {
      [showcase, capsule, lens].forEach(function (el) {
        if (el === srcEl) return;
        var r = el.getBoundingClientRect();
        var d = Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy);
        setLit(el, cx, cy, base * Math.max(0, 1 - d / radius));
      });
    }
    function attachGlow(el) {
      var g = document.createElement('div');
      g.className = 'lit-glow';
      el.appendChild(g);
      el._glow = g;
    }

    /* ================= 果冻拉伸 ================= */
    var jellyRAF = null;
    function applyJelly(el, k, deg) {
      if (!k || k < 0.001) { el.style.transform = ''; return; }
      el.style.transform = 'rotate(' + deg + 'deg) scale(' + (1 + k) + ',' + (1 - k * 0.45) + ') rotate(' + (-deg) + 'deg)';
    }
    function springEase(t) { return 1 - Math.exp(-5 * t) * Math.cos(9 * t); }
    function jellyBack(el, from, dur) {
      if (jellyRAF) cancelAnimationFrame(jellyRAF);
      var t0 = performance.now();
      (function step(now) {
        var t = Math.min(1, (now - t0) / dur);
        applyJelly(el, from * (1 - springEase(t)), 0);
        if (t < 1) jellyRAF = requestAnimationFrame(step);
        else { jellyRAF = null; el.style.transform = ''; }
      })(t0);
    }

    /* ================= 三件套 ================= */
    var showcase = document.getElementById('showcase');
    var capsule = document.getElementById('capsule');
    var lens = document.getElementById('lens');
    attachGlow(showcase); attachGlow(capsule); attachGlow(lens);

    // 三块玻璃：同一个原版 fragment，观感一致
    var showcaseGlass = makeGlass(showcase);
    var capsuleGlass = makeGlass(capsule);
    var lensGlass = makeGlass(lens);

    // 按钮按压：机体光 + 照亮另外两块
    var pressing = false;
    capsule.addEventListener('pointerdown', function (e) {
      pressing = true;
      try { capsule.setPointerCapture(e.pointerId); } catch (_) {}
      capsuleGlass.setStrength(1.3);
      var r = capsule.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      emitFlash(cx, cy);
      illuminate(capsule, cx, cy, 750, 1);
      e.preventDefault();
    });
    window.addEventListener('pointerup', function () {
      if (!pressing) return;
      pressing = false;
      capsuleGlass.setStrength(1);
      [showcase, lens].forEach(function (el) { setLit(el, 0, 0, 0); });
    });

    /* ================= 流体拖拽（圆玻璃 + 展示块共用） ================= */
    function makeFluidDraggable(el, glass, restShadow) {
      var st = { on: false, sx: 0, sy: 0, ox: 0, oy: 0, lx: 0, ly: 0, lt: 0, vx: 0, vy: 0, raf: null };
      el.addEventListener('pointerdown', function (e) {
        st.on = true;
        if (st.raf) { cancelAnimationFrame(st.raf); st.raf = null; }
        st.sx = e.clientX; st.sy = e.clientY;
        st.ox = el.offsetLeft; st.oy = el.offsetTop;
        st.lx = e.clientX; st.ly = e.clientY; st.lt = performance.now();
        st.vx = st.vy = 0;
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        glass.setStrength(1.2);
        e.preventDefault();
      });
      window.addEventListener('pointermove', function (e) {
        if (!st.on) return;
        el.style.left = (st.ox + e.clientX - st.sx) + 'px';
        el.style.top = (st.oy + e.clientY - st.sy) + 'px';
        var now = performance.now();
        var dt = Math.max(1, now - st.lt);
        st.vx = st.vx * 0.7 + (e.clientX - st.lx) / dt * 16 * 0.3;
        st.vy = st.vy * 0.7 + (e.clientY - st.ly) / dt * 16 * 0.3;
        st.lx = e.clientX; st.ly = e.clientY; st.lt = now;
        fluidFrame(el, st.vx, st.vy, e.clientX, e.clientY);
      });
      function end() {
        if (!st.on) return;
        st.on = false;
        glass.setStrength(1);
        [showcase, capsule, lens].forEach(function (o) { if (o !== el) setLit(o, 0, 0, 0); });
        if (st.raf) cancelAnimationFrame(st.raf);
        var f = 0.94;
        (function glide() {
          st.vx *= f; st.vy *= f;
          el.style.left = (el.offsetLeft + st.vx) + 'px';
          el.style.top = (el.offsetTop + st.vy) + 'px';
          var speed = Math.hypot(st.vx, st.vy);
          if (speed > 0.4) {
            fluidFrame(el, st.vx, st.vy, el.offsetLeft + el.offsetWidth / 2, el.offsetTop + el.offsetHeight / 2);
            st.raf = requestAnimationFrame(glide);
          } else {
            st.raf = null;
            el.style.boxShadow = restShadow;
            jellyBack(el, Math.min(0.1, speed / 40 + 0.04), 500);
          }
        })();
      }
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);
      return st;
    }

    function fluidFrame(el, vx_, vy_, px, py) {
      var speed = Math.hypot(vx_, vy_);
      var k = Math.min(0.16, speed / 420);
      var deg = speed > 0.5 ? Math.atan2(vy_, vx_) * 180 / Math.PI : 0;
      applyJelly(el, k, deg);
      var glow = Math.min(0.85, speed / 26);
      el.style.boxShadow =
        '0 4px 8px rgba(0,0,0,0.25), 0 -10px 25px inset rgba(0,0,0,0.15),' +
        '0 0 ' + (18 + speed * 2.2) + 'px rgba(255,255,255,' + (0.12 + glow * 0.5).toFixed(2) + ')';
      illuminate(el, px, py, 460, Math.max(0.25, glow));
    }

    var hint = lens.querySelector('.hint');
    var REST_SHADOW = '0 4px 8px rgba(0, 0, 0, 0.25), 0 -10px 25px inset rgba(0, 0, 0, 0.15)';
    lens.addEventListener('pointerdown', function () { hint.style.opacity = '0'; }, { once: true });
    makeFluidDraggable(lens, lensGlass, REST_SHADOW);

    // 展示块：可拖，首次拖动转 fixed
    var sFixed = false;
    showcase.addEventListener('pointerdown', function () {
      if (sFixed) return;
      sFixed = true;
      var r0 = showcase.getBoundingClientRect();
      showcase.style.position = 'fixed';
      showcase.style.left = r0.left + 'px';
      showcase.style.top = r0.top + 'px';
      showcase.style.margin = '0';
      showcase.style.zIndex = '45';
    });
    makeFluidDraggable(showcase, showcaseGlass, REST_SHADOW);
  </script>
</body>
</html>
